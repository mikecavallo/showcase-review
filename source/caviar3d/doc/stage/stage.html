<script type="module">
import { Studio } from '../../web/studio.js';
const S = document.getElementById('stage');
const W = 1920, H = 1080, XF = 0.7;
const lerp = (a, b, t) => a + (b - a) * t, clamp = (x, a, b) => Math.min(b, Math.max(a, x));

/* ---------------- map data ---------------- */

  'pacific': () => d3.geoNaturalEarth1().rotate([-212, 0]).center([0, 41]).scale(560).translate([W / 2, H / 2]),
  'east-coast': () => d3.geoConicConformal().parallels([33, 45]).rotate([75, 0]).center([0, 39.2]).scale(3200).translate([W / 2, H / 2]),
  'mississippi': () => d3.geoConicConformal().parallels([30, 45]).rotate([94, 0]).center([0, 39]).scale(2300).translate([W / 2, H / 2]),
  'caspian': () => d3.geoConicConformal().parallels([38, 48]).rotate([-46, 0]).center([0, 43]).scale(2300).translate([W / 2, H / 2]),
  'world': () => d3.geoNaturalEarth1().rotate([-10, 0]).center([0, 18]).scale(370).translate([W / 2, H / 2 + 20]),

const RIVERS = { // waypoints along the rivers [lon, lat], hand-traced from known towns
  mississippi: [[-95.2, 47.2], [-93.3, 45.0], [-91.6, 43.6], [-90.6, 41.6], [-91.3, 40.4], [-90.2, 38.6], [-89.5, 37.0], [-89.2, 36.0], [-90.05, 35.1], [-91.1, 33.4], [-91.2, 32.3], [-91.4, 31.0], [-91.2, 30.45], [-90.07, 29.95], [-89.4, 29.2]],
  missouri: [[-111.5, 45.9], [-111.3, 47.5], [-108.0, 47.6], [-104.0, 48.0], [-101.3, 47.3], [-100.8, 46.8], [-100.4, 44.4], [-98.4, 42.8], [-96.4, 42.5], [-95.9, 41.3], [-95.0, 39.8], [-94.6, 39.1], [-92.3, 38.6], [-90.2, 38.8]],
  ohio: [[-80.0, 40.4], [-82.6, 38.7], [-85.8, 38.25], [-87.6, 37.9], [-89.2, 37.0]],
  white: [[-93.9, 36.6], [-92.2, 36.2], [-91.6, 35.3], [-91.4, 34.3], [-91.1, 33.9]],
  arkansas: [[-97.3, 37.7], [-95.4, 35.6], [-94.4, 35.4], [-92.3, 34.75], [-91.1, 33.9]],

/* ---------------- shot builders: each returns {el, update(u, sec)} ---------------- */
const B = {};
B.photo = async (s) => {
  const L = el('div', 'fill');
  const img = await loadImg(IMG + s.src);
  if (s.fit === 'contain') { const bd = el('div', 'backdrop'); bd.style.backgroundImage = `url("${IMG + s.src}")`; L.appendChild(bd); }
  const k = el('div', 'kb'); const im = el('img'); im.src = img.src; k.appendChild(im); L.appendChild(k);
  const iw = img.naturalWidth || 1600, ih = img.naturalHeight || 900;
  const base = s.fit === 'contain' ? Math.min(W * .86 / iw, H * .84 / ih) : Math.max(W / iw, H / ih);
  im.style.width = iw * base + 'px'; im.style.height = ih * base + 'px'; im.style.display = 'block';
  if (s.fit === 'contain') im.style.boxShadow = '0 30px 90px rgba(0,0,0,.7)';
  if (s.mono) im.style.filter = 'grayscale(.15) contrast(1.05) sepia(.08)';
  const [a, b] = s.kb || [[1.04, 0, 0], [1.14, -.02, .01]];
  if (s.lower) { const lo = el('div', 'lower', `<div class="r"></div><div class="t">${s.lower[0]}</div>${s.lower[1] ? `<div class="s">${s.lower[1]}</div>` : ''}`); L.appendChild(lo); L._lo = lo; }
  if (s.cap) { const c = el('div', 'cap', s.cap); L.appendChild(c); }
  return { el: L, update(u) {
    const e = sm(u), sc = lerp(a[0], b[0], e), x = lerp(a[1], b[1], e) * W, y = lerp(a[2], b[2], e) * H;

  } };
};
B.title = async (s) => {
  const L = el('div', 'fill');
  if (s.bg) { const bd = el('div', 'backdrop'); bd.style.backgroundImage = `url("${IMG + s.bg}")`; bd.style.filter = 'blur(10px) brightness(.28)'; L.appendChild(bd); }
  const c = el('div', 'center');
  if (s.logo) { const i = el('img'); i.src = IMG + s.logo; i.style.cssText = 'height:200px;filter:invert(1) sepia(1) saturate(3) hue-rotate(5deg) brightness(.95);'; if (s.logoRaw) i.style.filter = ''; c.appendChild(i); }
  if (s.kicker) c.appendChild(el('div', 'kicker', s.kicker));

  c.appendChild(el('div', 'rule'));
  if (s.sub) c.appendChild(el('div', 'sub', s.sub));
  L.appendChild(c);
  const parts = [...c.children];
  return { el: L, update(u, sec) {
    parts.forEach((p, i) => { const o = sm((sec - .25 - i * .35) / .9); p.style.opacity = o; p.style.transform = `translateY(${(1 - o) * 18}px)`; });

};
B.quote = async (s) => {
  const L = el('div', 'fill');

  const c = el('div', 'center');
  if (s.mark) { const i = el('img'); i.src = IMG + s.mark; i.style.cssText = 'height:90px;opacity:.85;filter:invert(1) sepia(1) saturate(3) brightness(.9);'; c.appendChild(i); }
  const q = el('div', 'quote', `“${s.text}”`); c.appendChild(q);
  if (s.by) c.appendChild(el('div', 'by', s.by));
  L.appendChild(c);
  const parts = [...c.children];
  return { el: L, update(u, sec) {
    parts.forEach((p, i) => { p.style.opacity = sm((sec - .3 - i * .6) / 1.2); });
    if (L._bd) L._bd.style.transform = `scale(${1.05 + .06 * u})`;
  } };
};
B.number = async (s) => {
  const L = el('div', 'fill'); const c = el('div', 'center');
  const big = el('div', 'big gold', s.big); c.appendChild(big); c.appendChild(el('div', 'rule'));
  const sub = el('div', 'bigsub', s.sub || ''); c.appendChild(sub); L.appendChild(c);
  if (s.src) L.appendChild(el('div', 'src', s.src));
  const m = /^([^\d]*)([\d.,]+)(.*)$/.exec(s.big); const target = m ? parseFloat(m[2].replace(/,/g, '')) : null;
  return { el: L, update(u, sec) {
    if (target != null && s.count !== false) { const v = target * ease(clamp(sec / 1.8, 0, 1)); const dec = (m[2].split('.')[1] || '').length; big.textContent = m[1] + v.toLocaleString('en-US', { minimumFractionDigits: dec, maximumFractionDigits: dec }) + m[3]; }
    big.style.opacity = sm(sec / .6); sub.style.opacity = sm((sec - 1.2) / .8);
  } };
};
B.lines = async (s) => {
  const L = el('div', 'fill'); if (s.title) L.appendChild(el('div', 'ctitle', s.title));
  const box = el('div', 'lines' + (s.typed ? ' type' : '')); const items = s.items.map(t => { const d = el('div', 'l'); d.dataset.full = t; box.appendChild(d); return d; });
  L.appendChild(box); if (s.src) L.appendChild(el('div', 'src', s.src));
  return { el: L, update(u, sec) {
    const per = s.per || Math.max(1.4, (s.dur * .78) / items.length);
    items.forEach((d, i) => {
      const t0 = .35 + i * per, full = d.dataset.full;
      if (s.typed) { const n = Math.floor(clamp((sec - t0) / Math.max(.6, full.length * .04), 0, 1) * full.length); d.textContent = full.slice(0, n); d.style.opacity = sec > t0 ? 1 : 0; }
      else { d.textContent = full; const o = sm((sec - t0) / .7); d.style.opacity = o; d.style.transform = `translateX(${(1 - o) * -24}px)`; }
    });
  } };
};
B.chart = async (s) => {
  const L = el('div', 'fill'); if (s.title) L.appendChild(el('div', 'ctitle', s.title));
  const ch = el('div', 'chart'); const max = s.max || Math.max(...s.bars.map(b => b.value));
  const bars = s.bars.map(b => { const d = el('div', 'bar', `<div class="v">${b.text}</div><div class="k">${b.label}</div>`); ch.appendChild(d); return d; });
  L.appendChild(ch); if (s.src) L.appendChild(el('div', 'src', s.src));
  return { el: L, update(u, sec) { s.bars.forEach((b, i) => { const g = ease(clamp((sec - .4 - i * .5) / 1.6, 0, 1)) * (s.stall && i === s.bars.length - 1 ? .82 + .18 * (1 - sm((sec - 3) / 2)) : 1); bars[i].style.height = (b.value / max * 100 * g) + '%'; bars[i].querySelector('.v').style.opacity = sm((sec - 1.2 - i * .5) / .6); }); } };
};
B.map = async (s) => {
  await mapData();
  const L = el('div', 'fill'); L.style.background = 'radial-gradient(ellipse at 50% 40%, #0e1626, #05070c 75%)';
  const proj = VIEWS[s.view](); proj.clipExtent([[-80, -80], [W + 80, H + 80]]); const path = d3.geoPath(proj);
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(NS, 'svg'); svg.setAttribute('class', 'map'); svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  const g = document.createElementNS(NS, 'g'); svg.appendChild(g);
  const grat = document.createElementNS(NS, 'path'); grat.setAttribute('d', path(d3.geoGraticule().step([10, 10])()) || ''); grat.setAttribute('fill', 'none'); grat.setAttribute('stroke', 'rgba(217,184,113,.07)');
  const hi = new Set(s.highlight || []);
  // static base (graticule, land, borders, states) is baked into one image; only highlights, routes and pins stay live
  const base = document.createElementNS(NS, 'svg'); base.setAttribute('xmlns', NS); base.setAttribute('viewBox', `0 0 ${W} ${H}`); base.setAttribute('width', W); base.setAttribute('height', H);
  base.appendChild(grat);
  for (const f of WORLD.features) {
    const d = path(f); if (!d) continue;
    const on = hi.has(f.properties.name);
    const p = document.createElementNS(NS, 'path'); p.setAttribute('d', d);
    p.setAttribute('fill', '#1b1d22'); p.setAttribute('stroke', 'rgba(217,184,113,.32)'); p.setAttribute('stroke-width', '.8');
    base.appendChild(p);
    if (on) { const q = document.createElementNS(NS, 'path'); q.setAttribute('d', d); q.setAttribute('fill', 'rgba(217,184,113,0)'); q.setAttribute('stroke', 'none'); q.dataset.hi = [...hi].indexOf(f.properties.name); g.appendChild(q); }
  }
  if (s.states) for (const f of STATES.features) { const d = path(f); if (!d) continue; const p = document.createElementNS(NS, 'path'); p.setAttribute('d', d); p.setAttribute('fill', 'none'); p.setAttribute('stroke', 'rgba(217,184,113,.14)'); p.setAttribute('stroke-width', '.6'); base.appendChild(p); }
  const url = URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(base)], { type: 'image/svg+xml' }));
  const svgImg = await loadImg(url);
  const cnv = document.createElement('canvas'); cnv.width = W; cnv.height = H; cnv.getContext('2d').drawImage(svgImg, 0, 0, W, H);
  const bi = el('img'); bi.src = cnv.toDataURL('image/png'); await new Promise(r => bi.complete ? r() : (bi.onload = r)); bi.style.cssText = `position:absolute;left:0;top:0;width:${W}px;height:${H}px;transform-origin:50% 50%;`;
  L.appendChild(bi); L._bi = bi;
  const lines = [];
  for (const r of (s.rivers || [])) { const p = document.createElementNS(NS, 'path'); p.setAttribute('d', path({ type: 'LineString', coordinates: RIVERS[r.name] }) || ''); p.setAttribute('fill', 'none'); p.setAttribute('stroke', r.color || '#5f8fb8'); p.setAttribute('stroke-width', r.w || 4); p.setAttribute('stroke-linecap', 'round'); g.appendChild(p); lines.push({ p, at: r.at || 0, len: 0 }); }
  for (const a of (s.arcs || [])) { const p = document.createElementNS(NS, 'path'); p.setAttribute('d', path({ type: 'LineString', coordinates: a.via ? [a.from, ...a.via, a.to] : [a.from, a.to] }) || ''); p.setAttribute('fill', 'none'); p.setAttribute('stroke', '#d9b871'); p.setAttribute('stroke-width', a.w || 3); p.setAttribute('stroke-dasharray', a.dash || ''); g.appendChild(p); lines.push({ p, at: a.at || 0, len: 0, dur: a.dur || 1.6 }); }
  const pins = (s.pins || []).map(pn => {
    const [x, y] = proj([pn.lon, pn.lat]); const gg = document.createElementNS(NS, 'g');
    const ring = document.createElementNS(NS, 'circle'); ring.setAttribute('cx', x); ring.setAttribute('cy', y); ring.setAttribute('r', 10); ring.setAttribute('fill', 'none'); ring.setAttribute('stroke', '#d9b871'); ring.setAttribute('stroke-width', 2);
    const dot = document.createElementNS(NS, 'circle'); dot.setAttribute('cx', x); dot.setAttribute('cy', y); dot.setAttribute('r', 7); dot.setAttribute('fill', '#f1dc9d');
    const t = document.createElementNS(NS, 'text'); t.setAttribute('x', x + (pn.dx ?? 22)); t.setAttribute('y', y + (pn.dy ?? 10)); t.setAttribute('class', 'pinlabel'); t.setAttribute('text-anchor', pn.anchor || 'start'); t.textContent = pn.label || '';
    gg.appendChild(ring); gg.appendChild(dot); gg.appendChild(t); svg.appendChild(gg); return { gg, ring, at: pn.at || 0 };
  });
  L.appendChild(svg); if (s.label) L.appendChild(el('div', 'maplabel', s.label));
  const hiPaths = [...g.querySelectorAll('[data-hi]')];
  requestAnimationFrame(() => lines.forEach(l => { l.len = l.p.getTotalLength(); l.p.style.strokeDasharray = l.p.getAttribute('stroke-dasharray') || `${l.len} ${l.len}`; }));
  return { el: L, update(u, sec) {
    const z = s.zoom || [1, 1.08]; const sc = lerp(z[0], z[1], sm(u)); svg.style.transformOrigin = '50% 50%'; svg.style.transform = `scale(${sc})`; L._bi.style.transform = `scale(${sc})`;

B.product = async (s) => {

let shots = [], built = [], dur = 0;
window.loadScene = async (scene) => {
  for (const b of built) b.el.remove();
  built = []; shots = scene.shots; dur = scene.dur;
  for (const s of shots) {
    const b = await B[s.type](s); b.el.classList.add('layer'); S.insertBefore(b.el, document.getElementById('grain')); built.push(b);
  }
  await document.fonts.ready;
  return true;
};
const gctx = document.getElementById('grain').getContext('2d'); const gimg = gctx.createImageData(960, 540);
function grain(seed) { let x = seed * 9301 + 49297; const d = gimg.data; for (let i = 0; i < d.length; i += 4) { x = (x * 1103515245 + 12345) & 0x7fffffff; const v = (x >> 16) & 255; d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255; } gctx.putImageData(gimg, 0, 0); }
window.renderAt = (t, frame) => {

    const o = Math.min(fin, fout); const vis = t >= a - .01 && t <= e + .01;
    b.el.style.opacity = vis ? o : 0; b.el.style.zIndex = i;
    if (vis) b.update(clamp((t - a) / s.dur, 0, 1), t - a);

  document.getElementById('fade').style.opacity = Math.max(sc[0] ? 1 - sm(t / sc[0]) : 0, sc[1] ? sm((t - (dur - sc[1])) / sc[1]) : 0);
  grain(frame || 0);
  return true;
};
