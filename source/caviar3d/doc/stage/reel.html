<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/fonts.css">
<script type="importmap">{"imports":{"three":"../../web/vendor/three.module.js","three/addons/":"../../web/vendor/addons/"}}</script>
<style>
html,body{margin:0;background:#000}
#stage{position:relative;overflow:hidden;background:#07080c;color:#efe8da;font-family:'Cormorant Garamond',Georgia,serif}
.layer{position:absolute;inset:0;opacity:0}
.fill{position:absolute;inset:0}
canvas.p{position:absolute}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:26px;padding:0 90px}
.gold{background:linear-gradient(180deg,#f6e7b8 0%,#d9b871 55%,#9c7536 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.k{font-family:'Cinzel';letter-spacing:.42em;text-transform:uppercase;color:#a69c8a}
.t{font-family:'Cinzel';font-weight:500;letter-spacing:.12em;line-height:1.08}
.s{font-style:italic}
.rule{width:220px;height:1px;background:linear-gradient(90deg,transparent,#d9b871,transparent)}
.lab{position:absolute;left:0;right:0;text-align:center;font-family:'Cinzel';letter-spacing:.16em;color:#efe8da}
.lab small{display:block;font-family:'Cinzel';letter-spacing:.32em;color:#d9b871;margin-top:10px;text-transform:uppercase}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 80% 70% at 50% 50%,transparent 55%,rgba(0,0,0,.55) 100%)}
</style></head><body><div id="stage"><div id="vig"></div></div>
<script type="module">
import { Studio } from '../../web/studio.js';
const q = new URLSearchParams(location.search); const W = +(q.get('w') || 1080), H = +(q.get('h') || 1920);
const S = document.getElementById('stage'); S.style.width = W + 'px'; S.style.height = H + 'px';
const sm = t => { t = Math.min(1, Math.max(0, t)); return t * t * (3 - 2 * t); };
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const spec = await fetch('../../work/spec.json').then(r => r.json());
const vert = H > W, U = Math.min(W, H) / 1080;
const B = {};
B.title = async s => { const L = el('div', 'fill'); const c = el('div', 'center');
  c.innerHTML = `${s.k ? `<div class="k" style="font-size:${26 * U}px">${s.k}</div>` : ''}<div class="t gold" style="font-size:${(s.size || 110) * U}px">${s.t}</div><div class="rule"></div>${s.s ? `<div class="s" style="font-size:${46 * U}px">${s.s}</div>` : ''}`;
  L.appendChild(c); const parts = [...c.children];
  return { el: L, update(u, sec) { parts.forEach((p, i) => { const o = sm((sec - .2 - i * .3) / .8); p.style.opacity = o; p.style.transform = `translateY(${(1 - o) * 20}px)`; }); } }; };
B.prod = async s => { const L = el('div'); L.style.cssText = 'position:absolute;inset:0;background:radial-gradient(ellipse 70% 60% at 50% 45%,#15120c,#07080c 72%)';
  const n = s.items.length, cols = n === 1 ? 1 : (vert ? 2 : Math.min(4, n)), rows = Math.ceil(n / cols);
  const cell = n === 1 ? Math.min(W * .9, H * .62) : Math.min(W / cols, (H * .74) / rows);
  const top0 = (H - rows * cell) / 2 - (n === 1 ? 60 * U : 30 * U);
  const st = []; L._st = st;
  for (let i = 0; i < n; i++) {
    const r = Math.floor(i / cols), c = i % cols; const cv = el('canvas', 'p'); cv.width = cell; cv.height = cell;
    const x = (W - cols * cell) / 2 + c * cell, y = top0 + r * cell; cv.style.left = x + 'px'; cv.style.top = y + 'px'; cv.style.width = cell + 'px'; cv.style.height = cell + 'px'; L.appendChild(cv);
    const S3 = new Studio(cv, { base: '../../web', dpr: 1, preserve: true }); S3.size(cell, cell);
    await S3.load(Object.assign({ handle: s.items[i], period: 9 }, spec[s.items[i]]), '../../web/assets'); st.push(S3);
    if (n > 1 && s.labels) { const lb = el('div', 'lab', s.labels[i]); lb.style.cssText += `left:${x}px;width:${cell}px;right:auto;top:${y + cell - 70 * U}px;font-size:${24 * U}px;`; L.appendChild(lb); }
  }
  if (s.t) { const lb = el('div', 'lab', `${s.t}${s.sub ? `<small style="font-size:${22 * U}px">${s.sub}</small>` : ''}`); lb.style.cssText += `top:${n === 1 ? top0 + cell + 10 * U : H - 230 * U}px;font-size:${(n === 1 ? 52 : 40) * U}px;`; L.appendChild(lb); L._lb = lb; }
  return { el: L, update(u, sec) { st.forEach((x, i) => x.render(sec + (s.off || 0) + i * 1.7)); if (L._lb) L._lb.style.opacity = sm((sec - .4) / .7); } }; };
let shots = [], built = [], dur = 0; const XF = .5;
// shots are built when they come on screen and torn down after, so only a few WebGL contexts are ever alive
// (Chromium drops the oldest context past 16, which left early grids blank)
window.loadReel = async (r) => { for (const b of built) if (b) b.el.remove(); shots = r.shots; dur = r.dur; built = shots.map(() => null);
  await document.fonts.ready; return true; };
const kill = i => { const b = built[i]; if (!b || b === 'dead') return; (b.el._st || []).forEach(x => { x.renderer.dispose(); x.renderer.forceContextLoss(); }); b.el.remove(); built[i] = 'dead'; };
window.renderAt = async t => {
  for (let i = 0; i < shots.length; i++) { const s = shots[i], a = s.start, e = s.start + s.dur;
    const vis = t >= a - .01 && t <= e + .01;
    if (t > e + .05) { kill(i); continue; }
    if (!vis) continue;
    if (!built[i]) { const b = await B[s.type](s); b.el.classList.add('layer'); S.insertBefore(b.el, document.getElementById('vig')); built[i] = b; }
    const b = built[i];
    const o = Math.min(i === 0 ? sm(t / .6) : sm((t - a) / XF), i === shots.length - 1 ? 1 - sm((t - (dur - .8)) / .8) : 1 - sm((t - (e - XF)) / XF));
    b.el.style.opacity = o; b.update((t - a) / s.dur, t - a); }
  return true; };
window.ready = true;
</script></body></html>
